# Reference: https://github.com/pmndrs/zustand/blob/1808bf4d3dce944d054fa0cb9a605bd6d8e96d8d/.github/workflows/compressed-size-action.yml
name: Bundle size

on: [ pull_request ]

# Supersede in-flight runs for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    permissions:
      # Needed for the action to leave the size comparison comment.
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: true
          cache: true
      - id: get-options
        run: . ./scripts/set-node-options.sh --action
        shell: bash
      - uses: preactjs/compressed-size-action@2.10.0
        with:
          minimum-change-threshold: 1000
          compression: "none"
          build-script: "build:ci"
          clean-script: "clean"
          pattern: "./packages/main/prod/dist/**/*"
          strip-hash: "\\-(\\w{8})\\.js$"
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
        env:
          NODE_OPTIONS: ${{ steps.get-options.outputs.node-options }}
